<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203d35"><title>작은방 스튜디오 · 우리 아이 방</title><link rel="stylesheet" href="style.css?v=placement-3"></head><body>
<header><strong class="brand"><svg width="36" height="36" viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="10" fill="#c7e4aa"/><path d="m7 16 11-8 11 8v12H7V16Zm6 8v-7l5-4 5 4v7h-4v-5h-2v5h-4Z" stroke="#234237" stroke-width="2" stroke-linejoin="round"/></svg> 작은방 스튜디오</strong><span class="headtag">룸 플래너</span><span id="saved">● &nbsp; 이 기기에 저장</span></header>
<main><div class="intro"><div><div class="crumb">내 프로젝트 &nbsp; / &nbsp; 방 인테리어</div><h1>우리 아이의 첫 공부방<span>.</span></h1><p>가구를 옮겨 보고, 아이의 눈높이에서 방을 걸어보세요.</p></div><div class="switch"><button id="two" class="active">▦ &nbsp;2D 평면도</button><button id="three">◇ &nbsp;3D 둘러보기</button></div></div>
<section class="layout"><article class="work"><div class="panelhead"><div><i></i><b id="viewtitle">배치 평면도</b></div><small>단위 mm</small></div><div id="stage"><div id="plan"></div><div id="walk" hidden></div></div><div class="foot"><span id="hint">가구를 드래그해 위치를 조정하세요.</span><button id="share">↗ 배치 링크 복사</button></div></article>
<aside><div class="library"><div class="libtitle"><h2>가구 라이브러리</h2><span id="count"></span></div><div id="cards"></div></div><div class="inspector"><div class="libtitle"><h2>선택한 가구</h2><button id="edit">제품 정보 편집 ↗</button></div><h3 id="selected"></h3><div id="dims"></div><div class="actions"><button id="rotate">↻ &nbsp;90° 회전</button><button id="place"></button></div><div id="alert" role="status"></div></div></aside></section>
<section class="fixed"><div><small>고정 도면</small><h2>방 기본 정보</h2></div><div><small>가로 × 세로</small><b>2,400 × 2,800 mm</b></div><div><small>층고</small><b>2,300 mm</b></div><div><small>바닥 면적</small><b>6.72 m²</b></div><div><small>출입문 구간</small><b>900 mm</b></div></section></main>
<dialog id="dialog"><form id="form"><div class="libtitle"><h2>제품 정보 편집</h2><button type="button" id="close" aria-label="닫기">✕</button></div><label>가구 이름<input id="pname" required maxlength="80"></label><label>제품 상세페이지<input id="url" type="url" placeholder="https://"></label><a id="source" target="_blank" rel="noopener noreferrer">제품 상세페이지 열기 ↗</a><details><summary>링크 및 원문으로 모델 분석</summary><label>Gemini API 키 (AI 분석용)<input id="key" type="password" autocomplete="off"></label><label>상품 규격 원문 (접근 제한 페이지용)<textarea id="raw" rows="3"></textarea></label><button id="analyze" type="button">제품 규격 읽기</button><p id="analysis" role="status"></p></details><div class="fields"></div><p id="note"></p><button class="primary">모델에 적용</button></form></dialog>
<script src="catalog.js"></script><dialog id="models"><div class="libtitle"><h2 id="modelTitle"></h2><button id="dismissModels" aria-label="닫기">✕</button></div><div id="modelList"></div></dialog><script src="variants.js"></script><script src="plan.js?v=placement-3"></script><script src="scene.js"></script><script src="app.js?v=placement-3"></script></body></html>
